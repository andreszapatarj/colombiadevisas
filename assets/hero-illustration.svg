<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5FA8DA"/>
      <stop offset="55%" stop-color="#9FCBE8"/>
      <stop offset="100%" stop-color="#E4C99B"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF3D6" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#FFF3D6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skyline" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2E4E63"/>
      <stop offset="100%" stop-color="#1B3346"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#sky)"/>
  <circle cx="900" cy="260" r="220" fill="url(#sun)"/>

  <!-- clouds -->
  <g fill="#FFFFFF" opacity=".55">
    <ellipse cx="230" cy="140" rx="90" ry="28"/>
    <ellipse cx="300" cy="125" rx="60" ry="22"/>
    <ellipse cx="620" cy="90" rx="70" ry="20"/>
    <ellipse cx="150" cy="260" rx="70" ry="20"/>
  </g>

  <!-- plane -->
  <g transform="translate(760,190) rotate(-18)">
    <path d="M0 0 L150 8 L165 14 L150 20 L0 12 L-30 24 L-45 22 L-30 10 L-45 -2 L-30 -4 Z" fill="#F4F7FA"/>
    <path d="M40 6 L80 -38 L96 -36 L72 8 Z" fill="#DCE6EC"/>
    <path d="M40 14 L80 52 L96 50 L72 12 Z" fill="#DCE6EC"/>
  </g>
  <path d="M600 235 C700 225 800 215 900 205" stroke="#FFFFFF" stroke-width="3" opacity=".4" fill="none"/>

  <!-- city skyline -->
  <g fill="url(#skyline)">
    <rect x="740" y="560" width="60" height="220"/>
    <rect x="810" y="510" width="46" height="270"/>
    <rect x="866" y="600" width="70" height="180"/>
    <rect x="946" y="470" width="54" height="310"/>
    <rect x="1010" y="560" width="60" height="220"/>
    <rect x="1080" y="600" width="50" height="180"/>
    <rect x="1140" y="540" width="46" height="240"/>
  </g>
  <g fill="#12293B" opacity=".5">
    <rect x="946" y="470" width="54" height="14"/>
    <rect x="810" y="510" width="46" height="14"/>
  </g>

  <!-- runway ground -->
  <rect x="0" y="780" width="1200" height="120" fill="#5C7285"/>
  <rect x="0" y="780" width="1200" height="10" fill="#4A5F70"/>
  <g fill="#8AA0AF">
    <rect x="60" y="820" width="70" height="8"/>
    <rect x="220" y="820" width="70" height="8"/>
    <rect x="380" y="820" width="70" height="8"/>
  </g>

  <!-- window mullions (airport glass) -->
  <g fill="#1B3346" opacity=".9">
    <rect x="0" y="0" width="14" height="900"/>
    <rect x="380" y="0" width="10" height="900"/>
    <rect x="900" y="0" width="10" height="900"/>
  </g>

  <!-- traveler silhouette, back view, backpack + passport -->
  <g transform="translate(430,300)">
    <!-- backpack straps -->
    <path d="M40 90 C20 130 10 220 20 320 L60 320 C50 220 55 140 78 92 Z" fill="#0F2431"/>
    <path d="M210 90 C232 130 240 220 232 320 L192 320 C202 220 198 140 174 92 Z" fill="#0F2431"/>
    <!-- head -->
    <circle cx="126" cy="34" r="52" fill="#16324A"/>
    <path d="M78 40 C74 4 100 -18 128 -18 C158 -18 182 6 178 42 C160 22 150 40 126 34 C104 30 96 20 78 40 Z" fill="#0D1F2C"/>
    <!-- torso / hoodie -->
    <path d="M46 96 C46 60 90 40 126 40 C164 40 208 60 208 96 L224 320 L28 320 Z" fill="#1B3E58"/>
    <!-- backpack body -->
    <rect x="60" y="150" width="132" height="160" rx="18" fill="#0F2431"/>
    <rect x="86" y="170" width="80" height="18" rx="8" fill="#2E4E63"/>
    <!-- arm holding passport -->
    <path d="M208 160 C240 190 258 220 262 246 L232 258 C222 228 208 204 190 182 Z" fill="#1B3E58"/>
    <g transform="translate(224,240) rotate(18)">
      <rect x="0" y="0" width="46" height="62" rx="4" fill="#173E63"/>
      <rect x="6" y="6" width="34" height="50" rx="2" fill="#2A5C8C"/>
      <circle cx="23" cy="24" r="9" fill="#D8C27A"/>
    </g>
  </g>

  <!-- soft vignette at bottom-left for text contrast -->
  <rect x="0" y="0" width="600" height="900" fill="#0A1928" opacity=".18"/>
</svg>
