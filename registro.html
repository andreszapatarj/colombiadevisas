<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agenda una cita | Colombia de Visas</title><meta name="description" content="Agenda una cita con nuestro equipo."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body class="dark-page">
<header class="simple-head"><a class="brand" href="index.html">Colombia de Visas</a><a class="pill pill-outline" href="index.html">Volver</a></header>
<main class="form-page"><div class="form-card"><p class="eyebrow dark">Agenda una cita</p><h1>Cuéntanos qué necesitas</h1><form id="bookingForm">
<label>Nombre completo<input id="nombre" required autocomplete="name" placeholder="Tu nombre"></label>
<label>Correo electrónico<input id="correo" type="email" required autocomplete="email" placeholder="correo@ejemplo.com"></label>
<label>Teléfono / WhatsApp<input id="telefono" type="tel" required autocomplete="tel" placeholder="+57..."></label>
<label>Tipo de servicio<select id="tipoVisa" required><option value="">Selecciona...</option><option>Visa de trabajo</option><option>Visa de inversión</option><option>Visa de estudiante</option><option>Residencia</option><option>Otro</option></select></label>
<div class="choice-wrap"><p>¿Qué deseas hacer?</p><label class="choice"><input type="radio" name="opcion" value="agenda"><span>Tienes el presupuesto para agendar con nosotros? <strong>Agenda ya!</strong></span></label><label class="choice"><input type="radio" name="opcion" value="informacion"><span>¿Deseas más información? <strong>Comunícate con nosotros.</strong></span></label></div>
<div class="action-area"><button id="agendaBtn" class="pill pill-green hidden" type="submit">Agendar cita</button><button id="contactBtn" class="pill pill-green hidden" type="submit">Contáctanos</button></div><div id="formMsg" class="form-msg" role="status"></div></form></div></main>
<script src="js/booking-demo.js"></script></body></html>
