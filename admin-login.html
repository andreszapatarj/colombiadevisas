<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Acceso privado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  body{background:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .card{
    background:var(--paper);border-radius:10px;max-width:420px;width:100%;
    padding:40px 34px;box-shadow:0 24px 60px rgba(0,0,0,.35);
  }
  .card h1{font-size:1.5rem;margin-bottom:.2em;}
  .card p.lead{color:var(--ink-soft);font-size:.92rem;margin-bottom:28px;}
  .field{margin-bottom:18px;position:relative;}
  .field label{display:block;font-weight:600;font-size:.88rem;margin-bottom:6px;}
  .field input{
    width:100%;padding:12px 44px 12px 14px;border:1.5px solid var(--line);border-radius:6px;
    font-family:var(--font-body);font-size:1rem;background:var(--white);color:var(--ink);
  }
  .field input:focus{border-color:var(--deep);}
  .toggle-eye{
    position:absolute;right:10px;top:37px;background:none;border:0;cursor:pointer;
    padding:4px;color:var(--ink-soft);line-height:0;
  }
  .toggle-eye:hover{color:var(--ink);}
  .msg{font-size:.88rem;border-radius:6px;padding:10px 12px;margin-bottom:16px;display:none;}
  .msg-error{background:#FBE7E7;color:#7C2E3B;}
  .msg-warn{background:#FCF3D9;color:#7A5B0E;}
  .hint{font-size:.78rem;color:var(--ink-soft);margin-top:-8px;margin-bottom:18px;}
  .steps-hidden{display:none;}
</style>
</head>
<body>

<div class="card">
  <!-- Paso 1: inicio de sesión -->
  <div id="loginStep">
    <h1>Acceso privado</h1>
    <p class="lead">Panel de edición del sitio. Solo personal autorizado.</p>
    <div class="msg msg-error" id="loginError"></div>

    <form id="loginForm" autocomplete="off">
      <div class="field">
        <label for="username">Usuario</label>
        <input type="text" id="username" name="username" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" autocomplete="new-password" required>
        <button type="button" class="toggle-eye" id="toggleLoginPass" aria-label="Mostrar contraseña">
          <svg id="eyeIconLogin" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
      <button type="submit" class="btn btn-solid" style="width:100%;">Ingresar</button>
    </form>
  </div>

  <!-- Paso 2: cambio obligatorio en primer ingreso -->
  <div id="changeStep" class="steps-hidden">
    <h1>Configura tu acceso</h1>
    <p class="lead">Es tu primer ingreso. Por seguridad, crea un usuario y una contraseña nuevos antes de continuar.</p>
    <div class="msg msg-warn" id="changeError"></div>

    <form id="changeForm" autocomplete="off">
      <div class="field">
        <label for="newUsername">Nuevo usuario</label>
        <input type="text" id="newUsername" name="newUsername" autocomplete="off" required minlength="3">
      </div>
      <div class="field">
        <label for="newPassword">Nueva contraseña</label>
        <input type="password" id="newPassword" name="newPassword" autocomplete="new-password" required minlength="8">
        <button type="button" class="toggle-eye" id="toggleNewPass" aria-label="Mostrar contraseña">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
      <p class="hint">Mínimo 8 caracteres. Usa mayúsculas, números y símbolos.</p>
      <div class="field">
        <label for="confirmPassword">Confirma la contraseña</label>
        <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" required minlength="8">
        <button type="button" class="toggle-eye" id="toggleConfirmPass" aria-label="Mostrar contraseña">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
      <button type="submit" class="btn btn-solid" style="width:100%;">Guardar y entrar</button>
    </form>
  </div>
</div>

<script src="js/auth.js"></script>
<script>
(async () => {
  await bootstrapDefaultAdmin();

  const loginStep = document.getElementById("loginStep");
  const changeStep = document.getElementById("changeStep");
  const loginError = document.getElementById("loginError");
  const changeError = document.getElementById("changeError");

  function showEl(el, msg){ el.textContent = msg; el.style.display = "block"; }
  function hideEl(el){ el.style.display = "none"; }

  function wireEye(btnId, inputId){
    const btn = document.getElementById(btnId);
    const input = document.getElementById(inputId);
    btn.addEventListener("click", () => {
      const showing = input.type === "text";
      input.type = showing ? "password" : "text";
      btn.setAttribute("aria-label", showing ? "Mostrar contraseña" : "Ocultar contraseña");
    });
  }
  wireEye("toggleLoginPass","password");
  wireEye("toggleNewPass","newPassword");
  wireEye("toggleConfirmPass","confirmPassword");

  let pendingFirstLogin = false;

  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    hideEl(loginError);

    const locked = isLocked();
    if(locked){ showEl(loginError, `Demasiados intentos. Intenta de nuevo en ${locked}s.`); return; }

    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;
    const result = await verifyLogin(username, password);

    if(!result.ok){
      registerFailedAttempt();
      showEl(loginError, "Usuario o contraseña incorrectos.");
      document.getElementById("password").value = "";
      return;
    }

    clearAttempts();

    if(result.firstLogin){
      pendingFirstLogin = true;
      loginStep.classList.add("steps-hidden");
      changeStep.classList.remove("steps-hidden");
    }else{
      startSession();
      window.location.href = "admin.html";
    }
  });

  document.getElementById("changeForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    hideEl(changeError);

    const newUsername = document.getElementById("newUsername").value.trim();
    const newPassword = document.getElementById("newPassword").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if(newPassword !== confirmPassword){
      showEl(changeError, "Las contraseñas no coinciden.");
      return;
    }
    if(newPassword.length < 8){
      showEl(changeError, "La contraseña debe tener al menos 8 caracteres.");
      return;
    }

    await updateCredentials(newUsername, newPassword);
    startSession();
    window.location.href = "admin.html";
  });
})();
</script>
</body>
</html>
